name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: pushkar-anand/.github/.github/workflows/go-ci.yml@main

  coverage:
    uses: pushkar-anand/.github/.github/workflows/go-coverage.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      comment: false
